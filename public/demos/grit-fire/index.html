<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIT · 火焰粒子</title><style>*{margin:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}button{position:fixed;right:22px;bottom:22px;border:1px solid #ffffff28;border-radius:24px;background:#14100be0;color:#dbb481;padding:10px 18px;font:12px system-ui;cursor:pointer}p{position:fixed;bottom:26px;left:24px;color:#a47e55;font:11px system-ui;letter-spacing:2px;pointer-events:none}@media(max-width:500px){p{font-size:9px;left:16px;letter-spacing:1px}button{right:16px;bottom:20px}}</style></head><body><canvas id="scene" aria-label="GRIT 火焰粒子，移动鼠标或滑动屏幕驱散粒子"></canvas><p>移动 / 滑动 · 驱散火焰</p><button id="reset">重新聚拢</button><script>
/* Canvas sampling, repulsion and spring return adapted from Da0Mine/text-particleization. */
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const mask=document.createElement('canvas');mask.width=600;mask.height=1100;
const m=mask.getContext('2d',{willReadFrequently:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,dpr,scale,ox,oy,particles=[],embers=[],last=0,time=0,raf;
const pointer={x:-9999,y:-9999,active:false};
m.fillStyle='#fff';m.save();m.translate(48,1010);m.scale(.59,2.95);m.font="bold 210px 'Times New Roman',serif";m.scale(850/m.measureText('GRIT').width,1);m.fillText('GRIT',0,0);m.restore();
function flame(d){m.fill(new Path2D(d))}
flame('M76 810 C15 680 95 594 105 500 C116 424 167 379 149 292 C208 379 185 423 166 485 C149 557 210 583 183 673 C156 747 159 786 164 852 C119 774 126 728 110 696 C88 744 101 790 76 810Z');
flame('M220 855 C277 750 192 686 225 587 C252 510 274 469 240 399 C208 337 230 290 219 212 C295 303 310 342 279 431 C253 515 344 548 312 650 C286 730 316 780 267 870 C279 792 258 764 249 734 C229 777 241 825 220 855Z');
flame('M330 868 C369 743 286 674 330 568 C358 502 391 470 350 416 C309 370 289 323 317 261 C348 184 453 158 475 60 C499 151 404 197 382 267 C351 352 451 338 476 414 C505 498 418 560 411 635 C397 714 437 765 405 872 C398 780 369 752 369 703 C346 772 356 824 330 868Z');
flame('M454 799 C440 717 423 662 456 600 C489 536 518 544 514 458 C562 559 533 603 520 658 C504 712 523 749 532 808 C498 761 490 739 488 707 C468 743 473 773 454 799Z');
const data=m.getImageData(0,0,600,1100).data,sources=[];
for(let y=0;y<1100;y+=3)for(let x=0;x<600;x+=3)if(data[(y*600+x)*4+3]>128)sources.push({x:x+(Math.random()-.5)*1.7,y:y+(Math.random()-.5)*1.7,phase:Math.random()*6.283,size:.65+Math.random()*.8,heat:Math.random()});
const glow=document.createElement('canvas');glow.width=glow.height=32;const g=glow.getContext('2d'),gradient=g.createRadialGradient(16,16,0,16,16,16);gradient.addColorStop(0,'rgba(255,68,0,.22)');gradient.addColorStop(.3,'rgba(255,24,0,.08)');gradient.addColorStop(1,'rgba(255,0,0,0)');g.fillStyle=gradient;g.fillRect(0,0,32,32);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/700,(H-70)/1150);ox=(W-600*scale)/2;oy=(H-70-1100*scale)/2;particles=sources.map(p=>({...p,px:p.x,py:p.y,vx:0,vy:0}));embers=[];ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(reduced)draw(performance.now())}
function point(e){pointer.x=(e.clientX-ox)/scale;pointer.y=(e.clientY-oy)/scale;pointer.active=true}
canvas.addEventListener('pointermove',point);canvas.addEventListener('pointerdown',e=>{point(e);canvas.setPointerCapture(e.pointerId)});for(const event of ['pointerleave','pointercancel','pointerup'])canvas.addEventListener(event,()=>pointer.active=false);window.addEventListener('blur',()=>pointer.active=false);
document.querySelector('#reset').onclick=()=>{pointer.active=false;for(const p of particles){p.px=p.x;p.py=p.y;p.vx=p.vy=0}embers=[];if(reduced)draw(performance.now())};
function draw(stamp){const dt=Math.min((stamp-last)/16.667||1,2);last=stamp;time+=dt/60;ctx.globalCompositeOperation='source-over';ctx.fillStyle=reduced?'#000':'rgba(0,0,0,.3)';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.globalCompositeOperation='lighter';
for(const p of particles){const upper=Math.max(0,Math.min(1,(790-p.y)/650)),wave=reduced?0:Math.sin(time*2.5-p.y*.018+p.x*.012),tx=p.x+wave*upper*8,ty=p.y+(reduced?0:Math.sin(time*3+p.phase)*upper*3);if(pointer.active&&!reduced){const dx=p.px-pointer.x,dy=p.py-pointer.y,dist=Math.hypot(dx,dy);if(dist<110){const f=(1-dist/110)*1.7*dt,a=dist>.01?Math.atan2(dy,dx):p.phase;p.vx+=Math.cos(a)*f;p.vy+=Math.sin(a)*f}}p.vx+=(tx-p.px)*.02*dt;p.vy+=(ty-p.py)*.02*dt;p.vx*=Math.pow(.86,dt);p.vy*=Math.pow(.86,dt);p.px+=p.vx*dt;p.py+=p.vy*dt;const displacement=Math.min(1,Math.hypot(p.px-p.x,p.py-p.y)/45),flicker=reduced?1:.8+.2*Math.sin(time*5+p.phase),r=p.size*(1+displacement*.8);ctx.globalAlpha=flicker;ctx.drawImage(glow,p.px-9,p.py-9,18,18);ctx.fillStyle=`rgba(255,${Math.floor(115+p.heat*100)},${Math.floor(p.heat*45)},${(.48+p.heat*.35)*flicker})`;ctx.beginPath();ctx.arc(p.px,p.py,r,0,Math.PI*2);ctx.fill()}
ctx.globalAlpha=1;if(!reduced&&Math.random()<.6*dt){const p=sources[Math.floor(Math.random()*sources.length)];if(p.y<760)embers.push({x:p.x,y:p.y,vx:(Math.random()-.5)*.6,vy:-.8-Math.random()*1.6,life:1,size:.5+Math.random()})}for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.x+=(e.vx+Math.sin(time*2+e.y*.02)*.35)*dt;e.y+=e.vy*dt;e.life-=.008*dt;if(e.life<=0){embers.splice(i,1);continue}ctx.fillStyle=`rgba(255,${Math.round(70+e.life*120)},0,${e.life*.7})`;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill()}ctx.restore();if(!reduced)raf=requestAnimationFrame(draw)}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);pointer.active=false;if(!document.hidden){last=performance.now();draw(last)}});window.addEventListener('resize',resize);resize();if(!reduced)raf=requestAnimationFrame(draw);
})();
</script></body></html>
